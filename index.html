<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vera Bot — magicpin AI Chatbot</title>
    <meta name="description" content="Vera Bot — magicpin's AI-powered merchant engagement chatbot">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07070c;
            --bg-chat: #0b0b12;
            --bg-header: rgba(12, 12, 20, 0.85);
            --bg-input: rgba(18, 18, 28, 0.95);
            --bg-bubble-bot: rgba(139, 92, 246, 0.08);
            --bg-bubble-user: rgba(6, 182, 212, 0.08);
            --bg-glass: rgba(255,255,255,0.025);
            --border: rgba(255,255,255,0.06);
            --border-bot: rgba(139, 92, 246, 0.15);
            --border-user: rgba(6, 182, 212, 0.15);
            --border-hover: rgba(139, 92, 246, 0.4);
            --text-1: #f0f0f5;
            --text-2: #9090a8;
            --text-3: #55556a;
            --purple: #8b5cf6;
            --purple-soft: rgba(139, 92, 246, 0.12);
            --cyan: #06b6d4;
            --cyan-soft: rgba(6,182,212,0.12);
            --green: #22c55e;
            --green-soft: rgba(34,197,94,0.1);
            --amber: #f59e0b;
            --amber-soft: rgba(245,158,11,0.1);
            --red: #ef4444;
            --red-soft: rgba(239,68,68,0.1);
            --gradient: linear-gradient(135deg, #8b5cf6, #06b6d4);
            --gradient-2: linear-gradient(135deg, #6d28d9, #8b5cf6, #06b6d4);
            --gradient-glow: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(6,182,212,0.08));
            --radius: 16px;
            --radius-sm: 12px;
            --radius-xs: 8px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-1);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ═══════════ AMBIENT BACKGROUND ═══════════ */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 600px 400px at 20% 10%, rgba(139,92,246,0.06) 0%, transparent 70%),
                radial-gradient(ellipse 500px 500px at 80% 90%, rgba(6,182,212,0.04) 0%, transparent 70%),
                radial-gradient(ellipse 300px 300px at 50% 50%, rgba(139,92,246,0.02) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ═══════════ CHAT CONTAINER ═══════════ */
        .chat-container {
            width: 100%;
            max-width: 820px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            background: var(--bg-chat);
        }

        @media (max-width: 860px) {
            .chat-container {
                max-width: 100%;
                border-left: none;
                border-right: none;
            }
        }

       
        .chat-header {
            padding: 16px 24px;
            background: var(--bg-header);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 44px; height: 44px;
            background: var(--gradient);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 4px 24px rgba(139,92,246,0.3);
            position: relative;
        }

        .avatar::after {
            content: '';
            position: absolute;
            bottom: -1px; right: -1px;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--green);
            border: 2px solid var(--bg-chat);
            transition: background 0.3s;
        }

        .avatar.offline::after { background: var(--red); }

        .header-info h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-info .subtitle {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 1px;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 38px; height: 38px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-glass);
            color: var(--text-2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .icon-btn:hover {
            border-color: var(--border-hover);
            color: var(--purple);
            background: var(--purple-soft);
            transform: translateY(-1px);
        }

        .icon-btn:active { transform: scale(0.95); }

        /* ═══════════ CONVERSATION ID BAR ═══════════ */
        .conv-bar {
            padding: 8px 24px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(12,12,20,0.5);
            flex-shrink: 0;
        }

        .conv-label {
            font-size: 9px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1.2px;
            color: var(--text-3);
            white-space: nowrap;
        }

        .conv-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--cyan);
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 11px;
            outline: none;
        }

        .merchant-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--purple);
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 11px;
            outline: none;
        }

        .bar-sep {
            width: 1px;
            height: 16px;
            background: var(--border);
        }

        /* ═══════════ QUICK ACTION CHIPS ═══════════ */
        .quick-chips {
            padding: 10px 24px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
            background: rgba(12,12,20,0.4);
            flex-shrink: 0;
        }

        .chip {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg-glass);
            color: var(--text-2);
            font-size: 11px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            user-select: none;
        }

        .chip:hover {
            background: var(--purple-soft);
            border-color: var(--border-hover);
            color: var(--purple);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139,92,246,0.1);
        }

        .chip:active { transform: scale(0.97); }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
        .messages::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }

        /* Message bubble */
        .message {
            max-width: 78%;
            animation: msgIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.bot { align-self: flex-start; }
        .message.merchant { align-self: flex-end; }
        .message.system { align-self: center; max-width: 90%; }

        .msg-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 5px;
            padding-left: 4px;
        }

        .message.bot .msg-label { color: var(--purple); }
        .message.merchant .msg-label { color: var(--cyan); }

        .msg-content {
            padding: 13px 17px;
            border-radius: 18px;
            font-size: 13.5px;
            line-height: 1.65;
            word-wrap: break-word;
            white-space: pre-wrap;
            position: relative;
        }

        .message.bot .msg-content {
            background: var(--bg-bubble-bot);
            border: 1px solid var(--border-bot);
            border-top-left-radius: 4px;
        }

        .message.merchant .msg-content {
            background: var(--bg-bubble-user);
            border: 1px solid var(--border-user);
            border-top-right-radius: 4px;
        }

        .message.system .msg-content {
            background: var(--amber-soft);
            border: 1px solid rgba(245,158,11,0.12);
            border-radius: var(--radius-xs);
            text-align: center;
            font-size: 12px;
            color: var(--amber);
            padding: 8px 18px;
        }

        .msg-footer {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            padding-left: 4px;
        }

        .action-tag {
            display: inline-flex;
            align-items: center;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-tag.send { background: var(--green-soft); color: var(--green); }
        .action-tag.wait { background: var(--amber-soft); color: var(--amber); }
        .action-tag.end  { background: var(--red-soft); color: var(--red); }

        .msg-time {
            font-size: 10px;
            color: var(--text-3);
        }

        .msg-rationale {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 6px;
            padding: 8px 13px;
            background: rgba(0,0,0,0.25);
            border-radius: var(--radius-xs);
            font-style: italic;
            line-height: 1.5;
            border-left: 2px solid rgba(139,92,246,0.2);
        }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .empty-icon {
            width: 80px; height: 80px;
            background: var(--gradient-glow);
            border: 1px solid var(--border);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(139,92,246,0.08);
        }

        .empty-title {
            font-size: 18px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .empty-sub {
            font-size: 13px;
            color: var(--text-3);
            line-height: 1.7;
            max-width: 320px;
        }

        /* ═══════════ TYPING INDICATOR ═══════════ */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 14px 22px;
            background: var(--bg-bubble-bot);
            border: 1px solid var(--border-bot);
            border-radius: 18px;
            border-top-left-radius: 4px;
            animation: msgIn 0.3s ease-out;
        }

        .typing-indicator.show { display: flex; gap: 5px; align-items: center; }

        .typing-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--purple);
            animation: typingPulse 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes typingPulse {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-7px); opacity: 1; }
        }

        /* ═══════════ INPUT BAR ═══════════ */
        .input-bar {
            padding: 16px 24px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--bg-input);
            backdrop-filter: blur(16px);
            flex-shrink: 0;
        }

        .input-field {
            flex: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            color: var(--text-1);
            font-size: 13.5px;
            font-family: inherit;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-field:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(139,92,246,0.08);
        }

        .input-field::placeholder { color: var(--text-3); }

        .send-btn {
            width: 48px; height: 48px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--gradient);
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(139,92,246,0.3);
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 28px rgba(139,92,246,0.4);
        }

        .send-btn:active { transform: scale(0.95); }

        /* ═══════════ STATUS TOAST ═══════════ */
        .status-toast {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(-60px);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .status-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .status-toast.online {
            background: var(--green-soft);
            color: var(--green);
            border: 1px solid rgba(34,197,94,0.2);
        }

        .status-toast.offline {
            background: var(--red-soft);
            color: var(--red);
            border: 1px solid rgba(239,68,68,0.2);
        }
    </style>
</head>
<body>

<!-- Status toast -->
<div class="status-toast" id="statusToast"></div>

<div class="chat-container">

    <!-- ═══ HEADER ═══ -->
    <header class="chat-header">
        <div class="header-left">
            <div class="avatar" id="avatar">V</div>
            <div class="header-info">
                <h1>Vera Bot</h1>
                <div class="subtitle" id="subtitle">magicpin AI · <span id="statusText">Connecting…</span></div>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="resetConversation()" title="New Conversation">🔄</button>
            <button class="icon-btn" onclick="clearChat()" title="Clear Chat">🗑️</button>
        </div>
    </header>

    <!-- Headers removed for pure chatbot UI -->

    <!-- ═══ MESSAGES ═══ -->
    <div class="messages" id="messages">
        <div class="empty-state" id="chatEmpty">
            <div class="empty-icon">💬</div>
            <div class="empty-title">Start a Conversation</div>
            <div class="empty-sub">Type a merchant message below or use a quick action chip to simulate a merchant reply to Vera Bot.</div>
        </div>
        <!-- ═══ TYPING INDICATOR ═══ -->
        <div class="typing-indicator" id="typing">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>
    </div>

    <!-- ═══ INPUT BAR ═══ -->
    <div class="input-bar">
        <input type="text" class="input-field" id="inputField" placeholder="Type a merchant message…" onkeydown="if(event.key==='Enter')sendMsg()">
        <button class="send-btn" id="sendBtn" onclick="sendMsg()">↗</button>
    </div>

</div>

<script>
const API = "https://vera-backend-h6op.onrender.com";
let turn = 1;
let currentConvId = 'chat_1';
let currentMerchantId = 'm_001_drmeera_dentist_delhi'; // default fallback

// ═══ STATUS / HEALTH ═══
let wasOnline = null;
async function checkHealth() {
    try {
        const d = await fetch(`${API}/v1/healthz`).then(r => r.json());
        if (wasOnline !== true) {
            showToast('online', '● Connected to Vera Bot');
            wasOnline = true;
        }
        el('statusText').textContent = `Online · ${fmtUptime(d.uptime_seconds||0)}`;
        el('avatar').classList.remove('offline');
    } catch {
        if (wasOnline !== false) {
            showToast('offline', '● Bot Offline');
            wasOnline = false;
        }
        el('statusText').textContent = 'Offline';
        el('avatar').classList.add('offline');
    }
}

function fmtUptime(s) {
    if (s >= 3600) return Math.floor(s/3600) + 'h ' + Math.floor((s%3600)/60) + 'm';
    if (s >= 60) return Math.floor(s/60) + 'm ' + (s%60) + 's';
    return s + 's';
}

function showToast(type, msg) {
    const t = el('statusToast');
    t.className = `status-toast ${type}`;
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

// ═══ CHAT ═══
function quickSend(msg) {
    el('inputField').value = msg;
    sendMsg();
}

async function sendMsg() {
    const inp = el('inputField');
    const msg = inp.value.trim();
    if (!msg) return;
    inp.value = '';

    const mid = currentMerchantId;
    const cid = currentConvId;

    removeEmpty();
    addMsg('merchant', msg);

    // Show typing
    el('typing').classList.add('show');
    scrollBottom();

    try {
        const res = await fetch(`${API}/v1/reply`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                conversation_id: cid,
                merchant_id: mid,
                customer_id: null,
                from_role: 'merchant',
                message: msg,
                received_at: new Date().toISOString(),
                turn_number: turn++
            })
        }).then(r => r.json());

        el('typing').classList.remove('show');

        const action = res.action || '?';
        const body = res.body || '';
        const rationale = res.rationale || '';
        const wait = res.wait_seconds;

        if (action === 'send' && body) {
            addMsg('bot', body, action, rationale, res.cta);
        } else if (action === 'wait') {
            addMsg('bot', `⏳ Waiting ${wait||'?'}s`, action, rationale);
        } else if (action === 'end') {
            addMsg('bot', '🔚 Conversation ended', action, rationale);
            addSystem('Conversation ended by bot');
        } else {
            addMsg('bot', JSON.stringify(res, null, 2), action, rationale);
        }
    } catch (e) {
        el('typing').classList.remove('show');
        addSystem(`Error: ${e.message}`);
    }
}

function addMsg(role, text, action, rationale, cta) {
    const c = el('messages');
    const d = document.createElement('div');
    d.className = `message ${role}`;

    const footer = `<div class="msg-footer"><span class="msg-time">${now()}</span></div>`;

    d.innerHTML = `
        <div class="msg-label">${role === 'bot' ? '🤖 Vera Bot' : '🏪 Merchant'}</div>
        <div class="msg-content">${esc(text)}</div>
        ${footer}
    `;
    c.insertBefore(d, el('typing'));
    scrollBottom();
}

function addSystem(text) {
    const c = el('messages');
    const d = document.createElement('div');
    d.className = 'message system';
    d.innerHTML = `<div class="msg-content">${esc(text)}</div>`;
    c.insertBefore(d, el('typing'));
    scrollBottom();
}

function scrollBottom() {
    const c = el('messages');
    requestAnimationFrame(() => { c.scrollTop = c.scrollHeight; });
}

function removeEmpty() {
    const e = el('chatEmpty');
    if (e) e.remove();
}

function resetConversation() {
    turn = 1;
    currentConvId = 'chat_' + Math.floor(Math.random() * 9999);
    addSystem('New conversation started');
}

function clearChat() {
    el('messages').innerHTML = `<div class="empty-state" id="chatEmpty">
        <div class="empty-icon">💬</div>
        <div class="empty-title">Start a Conversation</div>
        <div class="empty-sub">Type a merchant message or use a quick action chip.</div>
    </div>
    <!-- ═══ TYPING INDICATOR ═══ -->
    <div class="typing-indicator" id="typing">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
    </div>`;
    turn = 1;
    currentConvId = 'chat_' + Math.floor(Math.random() * 9999);
}

// ═══ UTILS ═══
function el(id) { return document.getElementById(id); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function now() { return new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' }); }

async function startConversation() {
    const inp = el('inputField');
    const btn = el('sendBtn');
    
    try {
        inp.disabled = true;
        btn.disabled = true;
        inp.placeholder = "Vera is typing...";
        
        // Prompt for Merchant ID first
        if (!window.promptedForMerchant) {
            const inputMid = prompt("Enter your Merchant ID (or leave blank for Dr. Meera's Dental Clinic):");
            if (inputMid && inputMid.trim()) {
                currentMerchantId = inputMid.trim();
            }
            window.promptedForMerchant = true;
        }

        removeEmpty();
        el('typing').classList.add('show');
        
        const res = await fetch(`${API}/v1/start`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                conversation_id: currentConvId,
                merchant_id: currentMerchantId
            })
        }).then(r => r.json());
        
        el('typing').classList.remove('show');
        
        if (res.body) {
            addMsg('bot', res.body);
        }
    } catch (e) {
        el('typing').classList.remove('show');
        console.error("Failed to start conversation:", e);
    } finally {
        inp.disabled = false;
        btn.disabled = false;
        inp.placeholder = "Type a merchant message…";
        inp.focus();
    }
}

// ═══ INIT ═══
checkHealth().then(() => startConversation());
setInterval(checkHealth, 30000);
</script>
</body>
